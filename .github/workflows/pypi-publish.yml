name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install build tools
        run: pip install build twine

      - name: Build
        run: python -m build

      - name: Verify distribution metadata
        run: python -m twine check dist/*

      - name: Verify all packages are included in the distribution
        run: |
          python - <<'PY'
          import glob
          import sys
          import tarfile
          import zipfile

          # _mock_core holds internals shared by MockLibrary and MockResource.
          # If any of these is missing from the distribution, importing the
          # library fails at runtime, and nothing else in CI would catch it
          # because this workflow does not run the test suites.
          EXPECTED = {"LogCapture", "MockCallOrder", "MockCoverage",
                      "MockLibrary", "MockResource", "_mock_core"}
          errors = []

          def single(pattern):
              matches = glob.glob(pattern)
              if len(matches) != 1:
                  errors.append(f"expected exactly one {pattern}, found {matches}")
                  return None
              return matches[0]

          sdist = single("dist/*.tar.gz")
          if sdist:
              with tarfile.open(sdist) as archive:
                  names = archive.getnames()
              missing = {
                  package for package in EXPECTED
                  if not any(n.endswith(f"/src/{package}/__init__.py") for n in names)
              }
              if missing:
                  errors.append(f"sdist is missing {sorted(missing)}")

          wheel = single("dist/*.whl")
          if wheel:
              with zipfile.ZipFile(wheel) as archive:
                  names = archive.namelist()
                  missing = {
                      package for package in EXPECTED
                      if f"{package}/__init__.py" not in names
                  }
                  if missing:
                      errors.append(f"wheel is missing {sorted(missing)}")

                  top_level = [n for n in names if n.endswith("top_level.txt")]
                  if not top_level:
                      errors.append("wheel has no top_level.txt")
                  else:
                      declared = set(archive.read(top_level[0]).decode().split())
                      if declared != EXPECTED:
                          errors.append(
                              f"top_level.txt declares {sorted(declared)}, "
                              f"expected {sorted(EXPECTED)}"
                          )

          for error in errors:
              print(f"::error::{error}")
          if errors:
              sys.exit(1)
          print(f"Distribution contains all packages: {sorted(EXPECTED)}")
          PY

      - name: Verify the built wheel imports once installed
        run: |
          python -m venv /tmp/install-check
          /tmp/install-check/bin/python -m pip install --quiet dist/*.whl
          /tmp/install-check/bin/python - <<'PY'
          from LogCapture import LogCapture
          from MockCallOrder import MockCallOrder
          from MockCoverage import MockCoverage
          from MockLibrary import MockLibrary
          from MockResource import MockResource

          # The call-inspection keywords come from the shared _mock_core package,
          # so a missing or stale package shows up here as an absent attribute.
          required = (
              "get_keyword_call_args",
              "get_keyword_call_count",
              "get_keyword_call_kwargs",
              "verify_keyword_called_with",
          )
          for library in (MockLibrary, MockResource):
              missing = [name for name in required if not hasattr(library, name)]
              if missing:
                  raise SystemExit(
                      f"::error::{library.__name__} is missing {missing}"
                  )
          # MockCallOrder reads the call timeline out of _mock_core, so it is the
          # other way a stale shared package would surface.
          order_required = ("get_global_call_order", "reset_global_call_order")
          missing = [
              name for name in order_required if not hasattr(MockCallOrder, name)
          ]
          if missing:
              raise SystemExit(f"::error::MockCallOrder is missing {missing}")
          # LogCapture is a listener as well as a library: without the listener
          # hooks it imports cleanly and captures nothing at all.
          capture_required = (
              "captured_log_should_contain",
              "end_test",
              "get_captured_log_messages",
              "log_message",
              "start_capturing_log_messages",
              "stop_capturing_log_messages",
          )
          missing = [
              name for name in capture_required if not hasattr(LogCapture, name)
          ]
          if missing:
              raise SystemExit(f"::error::LogCapture is missing {missing}")
          assert LogCapture.ROBOT_LISTENER_API_VERSION == 2
          assert MockCoverage.ROBOT_LISTENER_API_VERSION == 3
          print("Installed wheel imports and exposes the expected keywords")
          PY

      - name: Publish
        run: twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
